site_name: yacd
site_description: Kubernetes-native Cardano development environments
repo_url: https://github.com/meigma/yacd
repo_name: meigma/yacd
docs_dir: docs

theme:
  name: material
  palette:
    # Automatic mode follows the operating system preference (the default).
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Light mode.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Developer Guide:
      - Getting started: developer/getting-started.md
      - Defining networks: developer/networks.md
      - Funding accounts: developer/funding.md
      - Connecting tools & tests: developer/connecting-tools.md
  - Operator Guide:
      - Installation: operator/installation.md
      - DB-Sync indexing: operator/db-sync.md
      - Testing & CI: operator/testing.md
  - Reference:
      - CLI: reference/cli.md
      - CardanoNetwork: reference/cardanonetwork.md
      - CardanoDBSync: reference/cardanodbsync.md
      - Environment file: reference/environment.md
      - Configuration: reference/configuration.md
  - Recipes: recipes.md
  - Troubleshooting: troubleshooting.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Security model: concepts/security.md
