# yacd environment — generated by `yacd init`.
#
# An "Environment" describes one Cardano network. Apply it with:
#   yacd up NAME -f yacd.yaml      # NAME is also the namespace by default
# (or let `yacd devnet` manage a local cluster + a default network for you).
#
# The active config below is a ready-to-run LOCAL devnet. Enabling the faucet
# gives it a genesis-funded `faucet` wallet you spend from with `yacd wallet
# topup`. Commented blocks show the rest of the API — uncomment a WHOLE block at
# a time (every field shown in a block is required together).
# More: https://github.com/meigma/yacd and docs/host-access.md.

apiVersion: yacd.meigma.io/devconfig/v1alpha1
kind: Environment
spec:
  network:
    # local generates a private devnet; public joins preview/preprod/mainnet.
    mode: local

    # The primary cardano-node, shared by both modes.
    node:
      version: "11.0.1"          # cardano-node release (drives the node image).
      port: 3001                 # node-to-node TCP port (1-65535).
      storage:
        size: 2Gi                # node DB volume (default 10Gi; raise for public networks).
        # storageClassName: standard   # pin a Kubernetes StorageClass (default: cluster default).
      # image: ghcr.io/my/cardano-node:tag   # override the full node image (else derived from version).
      # resources:                            # container requests/limits (omit to use cluster defaults).
      #   requests: {cpu: "1", memory: 2Gi}
      #   limits: {cpu: "2", memory: 4Gi}

    # Network-facing chain APIs deployed next to the node.
    chainAPI:
      # Ogmios (WebSocket bridge) and Kupo (chain indexer) are ENABLED by default.
      # Uncomment to pin image/port (keep all three fields together). Kupo needs Ogmios.
      # ogmios:
      #   enabled: true
      #   image: cardanosolutions/ogmios:v6.14.0
      #   port: 1337
      # kupo:
      #   enabled: true
      #   image: cardanosolutions/kupo:v2.11.0
      #   port: 1442

      # Faucet (local mode only): makes the controller generate a genesis-funded
      # `faucet` wallet that holds the initial supply. It is the network's funded
      # wallet and the default source for `yacd wallet topup NAME WALLET LOVELACE`.
      faucet:
        enabled: true
        port: 8080
        defaultSource: utxo1            # generated UTxO source the genesis wallet derives from.
        minTopUpLovelace: 1000000       # 1 ADA = 1_000_000 lovelace.
        maxTopUpLovelace: 100000000000
        # image: ghcr.io/my/faucet:tag  # override the faucet image (else controller default).

    # ---- LOCAL mode (required when mode: local; remove when mode: public) ----
    local:
      networkMagic: 42           # testnet magic for the node and client commands.
      era: conway                # newest ledger era (conway only; babbage is rejected).
      timing:
        slotLength: 100ms        # fast slots for quick local blocks.
        epochLength: 500         # slots per epoch.
      topology:
        pools:
          count: 1               # generated stake pools (1 only, currently).
          # defaults: {...}      # reserved: shared pool economics — not yet supported by the CLI.
      # genesis: {...}           # reserved: custom genesis preset/params — not yet supported by the CLI.

    # ---- PUBLIC mode (alternative to LOCAL) ----------------------------------
    # To join a public network: set `mode: public`, delete the `local:` block
    # above, and uncomment this. Public mode rejects explicit kupo/faucet
    # `enabled: true`. Mainnet also needs `bootstrap.mithril` and
    # `node.storage.size` >= 300Gi.
    # public:
    #   profile: preview         # one of: preview | preprod | mainnet.
    #   bootstrap:               # required for mainnet only.
    #     mithril:
    #       image: ghcr.io/input-output-hk/mithril-client:main-2478748
    #       snapshot: latest     # snapshot digest, or "latest".
