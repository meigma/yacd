# Source: chart/templates/controller-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yacd-controller-manager
  labels:
    helm.sh/chart: chart-0.1.1
    app.kubernetes.io/name: yacd
    app.kubernetes.io/instance: yacd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "v0.1.1"
    control-plane: controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: yacd
      app.kubernetes.io/instance: yacd
      control-plane: controller-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yacd
        app.kubernetes.io/instance: yacd
        control-plane: controller-manager
    spec:
      serviceAccountName: yacd-controller-manager
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: "ghcr.io/meigma/yacd@sha256:5d53ca824dacad39c482dc93edfd2db4a65d5803f43dce5b18b1a7482b0f8e21"
          imagePullPolicy: IfNotPresent
          args:
            - "--health-probe-bind-address=:8081"
            - "--metrics-bind-address=:8443"
            - "--metrics-secure=true"
            - "--leader-elect"
            - "--log-format=json"
            - "--log-level=info"
            - "--default-faucet-image=ghcr.io/meigma/yacd/faucet@sha256:826f8d52f0a4b0f607e2293cf72a8217de27700b5e5f1b35e1af86ef18fd3f66"
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
